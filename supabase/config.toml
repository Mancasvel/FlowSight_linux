# FlowSight Supabase project configuration.
# Link with: supabase link --project-ref dzpyrdxelcgfpmcdojvb

[project]
id = "dzpyrdxelcgfpmcdojvb"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# The OAuth callback is reached directly from Notion and validates a hashed,
# expiring, single-use state itself. Authenticated actions still verify the
# Supabase JWT inside the function.
[functions.notion-oauth]
verify_jwt = false

[functions.notion-destinations]
verify_jwt = true

[functions.publish-notion-report]
verify_jwt = true

[functions.privacy-rights]
verify_jwt = true

# Authenticated users with a paid integrations entitlement only. The Google
# desktop client secret is stored in Supabase secrets, never in the Tauri app.
[functions.calendar-token]
verify_jwt = true
