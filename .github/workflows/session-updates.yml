name: Linux session and UI verification

on:
  push:
    branches: [fix/session-and-ui-updates]
  pull_request:
    paths:
      - apps/agent/**
      - scripts/**
      - .github/workflows/session-updates.yml
      - package.json
      - pnpm-lock.yaml

concurrency:
  group: linux-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Tauri and desktop keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config patchelf gstreamer1.0-tools gstreamer1.0-pipewire libpipewire-0.3-0 libdbus-1-dev gnome-keyring dbus-x11
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target
      - name: Compile-only resource placeholders
        run: node scripts/prepare-ci-resource-stubs.mjs
      - name: Native Linux compilation
        working-directory: apps/agent/src-tauri
        run: cargo check --locked --all-targets
      - name: Rust library tests
        working-directory: apps/agent/src-tauri
        run: cargo test --locked --lib
      - name: Native Secret Service persistence
        working-directory: apps/agent/src-tauri
        run: |
          dbus-run-session -- bash -euc '
            printf "ci-test-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --lib secure_config::tests::native_secret_service_roundtrip -- --ignored
          '
      - name: Install renderer dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Renderer tests
        run: node --test apps/agent/src/renderer/*.test.mjs
      - name: Renderer production build
        run: corepack pnpm --filter @flowsight/agent exec vite build
