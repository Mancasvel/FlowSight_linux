name: Release — FlowSight Agent (Linux)

on:
  # Publicar una release en GitHub → build + adjuntar .deb y .AppImage
  release:
    types: [published]
  # Alternativa: git tag vX.Y.Z && git push origin vX.Y.Z
  push:
    tags:
      - "v*"
  # Re-ejecutar manualmente para una tag existente (p. ej. v3.5.0)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release existente (ej. v3.5.0)"
        required: true
        type: string

concurrency:
  group: release-linux-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLOWSIGHT_MODELS_REPO: Mancasvel/FlowSight.AI
  FLOWSIGHT_MODELS_TAG: models-v0.1.0

jobs:
  build-and-upload-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building FlowSight Agent for tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Reject outdated tauri 2.9.x (stale release tag)
        shell: bash
        run: |
          set -euo pipefail
          f=apps/agent/src-tauri/Cargo.toml
          if grep -qE 'tauri = \{ version = "2\.9' "$f"; then
            echo "::error title=Stale release tag::Tag must point to a commit with Tauri 2.10+."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Linux — Tauri + ScreenCast (GStreamer/PipeWire) deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            pkg-config \
            patchelf \
            gstreamer1.0-tools \
            gstreamer1.0-pipewire \
            libpipewire-0.3-0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages (pnpm monorepo)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_JIRA_CLIENT_ID: ${{ secrets.TAURI_JIRA_CLIENT_ID }}
          TAURI_JIRA_CLIENT_SECRET: ${{ secrets.TAURI_JIRA_CLIENT_SECRET }}
          TAURI_LINEAR_CLIENT_ID: ${{ secrets.TAURI_LINEAR_CLIENT_ID }}
          TAURI_LINEAR_CLIENT_SECRET: ${{ secrets.TAURI_LINEAR_CLIENT_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: List bundle outputs
        run: |
          ls -la apps/agent/src-tauri/target/release/bundle/deb/ || true
          ls -la apps/agent/src-tauri/target/release/bundle/appimage/ || true

      - name: Upload .deb and AppImage to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            apps/agent/src-tauri/target/release/bundle/deb/*.deb
            apps/agent/src-tauri/target/release/bundle/appimage/*.AppImage
