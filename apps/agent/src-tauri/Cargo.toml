[package]
name = "app"
version = "5.0.18"
description = "FlowSight Agent — Understand your own Workflows"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Screenshots are resized from RGBA pixels and encoded only as PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
whoami = "1.5"
active-win-pos-rs = "0.8"
oauth2 = { version = "5.0", default-features = false, features = ["reqwest-blocking", "rustls-tls"] }
url = "2.5"
tiny_http = "0.12"
open = "5.0"
dotenv = "0.15"
urlencoding = "2.1"
flate2 = "1"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
zip = "2"
screenshots = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_Security_Cryptography",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
